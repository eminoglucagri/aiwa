# Security Scanning Pipeline — AIWA-31
#
# Dedicated workflow for deep security scans that run on schedule and on-demand.
# This complements the security-checks job in code-review.yml, which runs on every PR.
#
# Triggers:
#   - Every Monday at 06:00 UTC  (catch new CVEs against existing deps)
#   - Manual dispatch           (security team can trigger anytime)
#   - On merge to main          (defense-in-depth after CI passed)
#
# This workflow intentionally does NOT block merges — it's for visibility
# and alerting. Blocking decisions live in code-review.yml's security-checks job.

name: Security Scanning (Deep)

on:
  schedule:
    # Every Monday at 06:00 UTC — catch newly-disclosed CVEs
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      scan_target:
        description: 'Target to scan'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - frontend
          - backend
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Allow concurrent deep scans; they generate artifacts

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Dependency CVE scanning (npm + pip)
  # Fails on HIGH/CRITICAL — alerts are sent
  # ─────────────────────────────────────────────
  dependency-audit:
    name: Dependency CVE Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: frontend
            tool: npm
            command: 'cd frontend && npm audit --audit-level=high'
          - path: backend
            tool: pip-audit
            command: 'cd backend && pip-audit --requirement=requirements.txt --fail-on=high --fail-on=critical'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (for npm audit)
        if: matrix.tool == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Setup Python (for pip-audit)
        if: matrix.tool == 'pip-audit'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          if [ "${{ matrix.tool }}" = "npm" ]; then
            npm ci
          else
            pip install -r ${{ matrix.path }}/requirements.txt pip-audit
          fi

      - name: Run ${{ matrix.tool }} audit
        run: ${{ matrix.command }}
        continue-on-error: true

      - name: Report CVE findings
        if: runner.os == 'Linux'
        run: |
          echo "### Dependency CVE Audit (${{ matrix.tool }})" >> $GITHUB_STEP_SUMMARY
          echo "Target: ${{ matrix.path }}" >> $GITHUB_STEP_SUMMARY
          echo "Tool: ${{ matrix.tool }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review findings in the action log above. HIGH/CRITICAL issues require immediate attention." >> $GITHUB_STEP_SUMMARY

      - name: Fail on HIGH/CRITICAL CVEs
        if: matrix.tool == 'npm'
        run: |
          # Re-run without continue-on-error to actually fail
          ${{ matrix.command }}
        # Note: pip-audit already uses --fail-on=high --fail-on=critical above

  # ─────────────────────────────────────────────
  # Job 2: OWASP Dependency Check
  # Scans frontend (Node.js) and backend (Python) for known CVEs
  # Reports to GitHub Security tab as SARIF
  # ─────────────────────────────────────────────
  owasp-dep-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: ['frontend', 'backend']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.scope == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        if: matrix.scope == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: matrix.scope == 'frontend'
        run: cd frontend && npm ci

      - name: Install Python dependencies
        if: matrix.scope == 'backend'
        run: pip install -r backend/requirements.txt

      - name: Run OWASP Dependency-Check (Node.js)
        if: matrix.scope == 'frontend'
        uses: dependency-check/dependency-check-action@v3
        with:
          project: 'aiwa-frontend'
          path: frontend
          format: 'SARIF'
          output: owasp-frontend-results.sarif
          failOnCVSS: '7'  # Fail on HIGH (7.0+) and CRITICAL (9.0+)
          skipNewer: false
          node: true

      - name: Run OWASP Dependency-Check (Python)
        if: matrix.scope == 'backend'
        uses: dependency-check/dependency-check-action@v3
        with:
          project: 'aiwa-backend'
          path: backend
          format: 'SARIF'
          output: owasp-backend-results.sarif
          failOnCVSS: '7'
          skipNewer: false

      - name: Upload OWASP results to GitHub Security
        if: matrix.scope == 'frontend'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: owasp-frontend-results.sarif
          category: 'owasp-depcheck-frontend'

      - name: Upload OWASP results to GitHub Security
        if: matrix.scope == 'backend'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: owasp-backend-results.sarif
          category: 'owasp-depcheck-backend'

  # ─────────────────────────────────────────────
  # Job 3: SAST — Extended Semgrep scanning
  # Runs additional rulesets beyond the PR pipeline
  # ─────────────────────────────────────────────
  sast-scan:
    name: SAST Scanning (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (full rulesets)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >
            p/security-audit
            p/secrets
            p/typescript
            p/python
            p/react
            p/flask
            p/aws-exploitation
            p/sql-injection
            p/owasp-top10
          upload-to-sarif: true

  # ─────────────────────────────────────────────
  # Job 4: Secrets detection (dedicated, deep scan)
  # ─────────────────────────────────────────────
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for committed secrets
        run: |
          # Scan entire repository; fail if any secrets are found
          detect-secrets scan --baseline .secrets.baseline . | detect-secrets audit --fail-on-any --display-format text || {
            echo ""
            echo "FAILED: Secrets detected in repository."
            echo "To update the baseline after reviewing false positives:"
            echo "  detect-secrets scan --baseline .secrets.baseline ."
            echo "  git add .secrets.baseline"
            echo "  git commit -m 'chore: update secrets baseline'"
            exit 1
          }

  # ─────────────────────────────────────────────
  # Job 5: Outdated dependency check
  # Flags dependencies with newer major versions
  # ─────────────────────────────────────────────
  outdated-deps:
    name: Outdated Dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: frontend
            tool: npm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        run: cd ${{ matrix.path }} && npm ci

      - name: Check outdated packages
        run: |
          echo "### Outdated Dependencies (${{ matrix.path }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cd ${{ matrix.path }}
          npm outdated --json | jq -r '
            to_entries[] |
            select(.value.major != null) |
            "\(.key) \(.value.current) → \(.value.latest) (major: \(.value.major))"
          ' >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review major version updates above — they may include breaking changes or security fixes." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # Job 6: Summary & alerting
  # ─────────────────────────────────────────────
  security-summary:
    name: Security Scan Summary
    needs: [dependency-audit, owasp-dep-check, sast-scan, secrets-scan, outdated-deps]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate scan summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY

          for job in dependency-audit owasp-dep-check sast-scan secrets-scan outdated-deps; do
            status=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs --jq '.jobs[] | select(.name == "${{ matrix.scope || 'n/a' }}" or .name | contains("$job")) | .conclusion' 2>/dev/null | head -1 || echo "unknown")
            echo "| $job | $status |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View full details:** [GitHub Security tab](https://github.com/${{ github.repository }}/security)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scheduled scans run weekly on Monday at 06:00 UTC. Trigger manually via 'Run workflow' for on-demand scanning." >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "=== AIWA-31 Security Scan Complete ==="
          echo "Dependency CVE audit: ${{ needs.dependency-audit.result }}"
          echo "OWASP dep check: ${{ needs.owasp-dep-check.result }}"
          echo "SAST scan: ${{ needs.sast-scan.result }}"
          echo "Secrets detection: ${{ needs.secrets-scan.result }}"
          echo "Outdated deps: ${{ needs.outdated-deps.result }}"

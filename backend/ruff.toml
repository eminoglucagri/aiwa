# See https://docs.astral.sh/ruff/configuration/ for configuration docs.

line-length = 100
target-version = "py312"

[lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "SIM",    # flake8-simplify
  "RUF",    # Ruff-specific rules
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in argument defaults
  "SIM102", # use if/else instead of ternary
]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "single"
